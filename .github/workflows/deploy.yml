name: Test, Deploy & Publish

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Test ────────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pytest
      - run: pip install -e .
      - run: python -m pytest tests/ -x -q -m "not slow"

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd packages/helmlab-js && npm ci && npx vitest run

  # ─── Version consistency guard ────────────────────────
  # Fails the build if pyproject / __init__ / helmlab-js / site version.ts drift.
  # Blocks every deploy and publish job below — no drifted version ships.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bump_version.py --check

  # ─── 2. Build & Deploy landing-new (Astro) ────────────
  deploy:
    needs: [test-js, version-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build helmlab-js local dependency
        run: cd packages/helmlab-js && npm ci && npm run build

      - name: Install postcss-helmlab dependencies
        # Required because landing-new links postcss-helmlab via `file:` and
        # postcss is a peerDep — the symlinked package needs its own node_modules
        # for Node's `import "postcss"` to resolve from inside its index.js.
        run: cd packages/postcss-helmlab && npm install --no-audit --no-fund

      - name: Install landing dependencies
        run: cd landing/landing-new && npm install

      - name: Build Astro site
        run: cd landing/landing-new && npm run build

      - name: Regenerate OG card (claims-driven)
        # public/og-card.png is a screenshot of the claims-driven /og-card page —
        # regenerate it every deploy so the social card never ships stale numbers.
        # Google Chrome is preinstalled on ubuntu runners; the fresh PNG must be
        # copied into dist/ because the build already copied the old public/ one.
        run: |
          cd landing/landing-new
          CHROME_BIN="$(command -v google-chrome || command -v chromium-browser)" \
            node scripts/generate-og.mjs
          cp public/og-card.png dist/og-card.png

      - name: Claims consistency guard
        # Every site number derives from src/data/claims.ts. This blocks deploy
        # if a stale / inconsistent claim leaked into the built output (the old
        # 64/65/66 win records, the 11.6 KB bundle, an out-of-date version, etc.).
        # When ColorBench is re-run, regenerate with colorbench/scripts/generate_claims.py.
        run: |
          cd landing/landing-new
          if grep -rqE "64-9-17|65-9-16|wins 6[456][^0-9]|6[456]-9-1[0-9]|11\.6 ?KB|v0\.12\.[0-9]" dist; then
            echo "::error::Stale/inconsistent claim numbers in built site:"
            grep -rnE "64-9-17|65-9-16|wins 6[456][^0-9]|11\.6 ?KB|v0\.12\.[0-9]" dist | head
            exit 1
          fi
          echo "claims guard OK — site numbers consistent"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 89.252.184.6 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy static site
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key" \
            landing/landing-new/dist/ root@89.252.184.6:/home/ismailyagci/web/helmlab.space/public_html/

      - name: Stop legacy API & fix permissions
        run: |
          ssh -i ~/.ssh/deploy_key root@89.252.184.6 "
            pm2 delete helmlab-api 2>/dev/null || true
            pm2 save 2>/dev/null || true
            chown -R ismailyagci:www-data /home/ismailyagci/web/helmlab.space/public_html/
          "

  # ─── 3. Publish npm (only when version changes) ────────
  publish-npm:
    needs: [test-js, version-guard]
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC): no NPM_TOKEN — npm mints a short-lived
    # credential from the GitHub Actions OIDC token. Requires the trusted
    # publisher to be configured on npmjs.com for the `helmlab` package
    # (repo Grkmyldz148/helmlab, workflow deploy.yml) and npm CLI >= 11.5.1.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if JS version changed
        id: version-check
        run: |
          OLD=$(git show HEAD~1:packages/helmlab-js/package.json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "0.0.0")
          NEW=$(python3 -c "import json; print(json.load(open('packages/helmlab-js/package.json'))['version'])")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version-check.outputs.changed == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        if: steps.version-check.outputs.changed == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Build & publish to npm (OIDC, provenance)
        if: steps.version-check.outputs.changed == 'true'
        run: cd packages/helmlab-js && npm ci && npm publish

  # ─── 3b. Publish postcss-helmlab (only when version changes) ──
  publish-postcss-helmlab:
    needs: [publish-npm]
    runs-on: ubuntu-latest
    # Same OIDC trusted-publishing setup — configured separately on npmjs.com
    # for the `postcss-helmlab` package (same repo + workflow values).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if postcss-helmlab version changed
        id: version-check
        run: |
          OLD=$(git show HEAD~1:packages/postcss-helmlab/package.json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "0.0.0")
          NEW=$(python3 -c "import json; print(json.load(open('packages/postcss-helmlab/package.json'))['version'])")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version-check.outputs.changed == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        if: steps.version-check.outputs.changed == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Rewrite local helmlab dependency to published version
        if: steps.version-check.outputs.changed == 'true'
        run: |
          # Replace `"helmlab": "file:../helmlab-js"` with the just-published version
          # so the published postcss-helmlab tarball pulls helmlab from the registry.
          HL_VERSION=$(python3 -c "import json; print(json.load(open('packages/helmlab-js/package.json'))['version'])")
          python3 -c "
          import json
          p = 'packages/postcss-helmlab/package.json'
          d = json.load(open(p))
          d['dependencies']['helmlab'] = '^' + '$HL_VERSION'
          json.dump(d, open(p, 'w'), indent=2)
          "

      - name: Publish postcss-helmlab (OIDC, provenance)
        if: steps.version-check.outputs.changed == 'true'
        run: cd packages/postcss-helmlab && npm publish --access public

  # ─── 4. Publish PyPI (only when version changes) ───────
  publish-pypi:
    needs: [test-python, version-guard]
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC): no PYPI_TOKEN — pypa/gh-action-pypi-publish
    # exchanges the GitHub OIDC token for a short-lived PyPI credential.
    # Requires the trusted publisher to be configured on pypi.org for `helmlab`
    # (owner Grkmyldz148, repo helmlab, workflow deploy.yml, no environment).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Python version changed
        id: version-check
        run: |
          OLD=$(git show HEAD~1:pyproject.toml 2>/dev/null | python3 -c "
          import sys
          for line in sys.stdin:
              if line.strip().startswith('version'):
                  print(line.split('\"')[1])
                  break
          " 2>/dev/null || echo "0.0.0")
          NEW=$(python3 -c "
          for line in open('pyproject.toml'):
              if line.strip().startswith('version'):
                  print(line.split('\"')[1])
                  break
          ")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version-check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        if: steps.version-check.outputs.changed == 'true'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (OIDC)
        if: steps.version-check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

