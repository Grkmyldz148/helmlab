name: Test, Deploy & Publish

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Test ────────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pytest
      - run: pip install -e .
      - run: python -m pytest tests/ -x -q -m "not slow"

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd packages/helmlab-js && npm ci && npx tsc --noEmit && npx vitest run

  # ─── Version consistency guard ────────────────────────
  # Fails the build if pyproject / __init__ / helmlab-js / site version.ts drift.
  # Blocks every deploy and publish job below — no drifted version ships.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bump_version.py --check

  # ─── 3. Publish npm (only when version changes) ────────
  publish-npm:
    needs: [test-js, version-guard]
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC): no NPM_TOKEN — npm mints a short-lived
    # credential from the GitHub Actions OIDC token. Requires the trusted
    # publisher to be configured on npmjs.com for the `helmlab` package
    # (repo helmlab-space/helmlab, workflow deploy.yml) and npm CLI >= 11.5.1.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if JS version needs publishing
        id: version-check
        # Registry-based (not HEAD~1): a failed publish can be retried by
        # re-running the workflow — the gate only skips versions already live.
        run: |
          OLD=$(npm view helmlab version 2>/dev/null || echo "0.0.0")
          NEW=$(python3 -c "import json; print(json.load(open('packages/helmlab-js/package.json'))['version'])")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version-check.outputs.changed == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        if: steps.version-check.outputs.changed == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Build & publish to npm (OIDC, provenance)
        if: steps.version-check.outputs.changed == 'true'
        run: cd packages/helmlab-js && npm ci && npm publish

  # ─── 3b. Publish postcss-helmlab (only when version changes) ──
  publish-postcss-helmlab:
    needs: [publish-npm]
    runs-on: ubuntu-latest
    # Same OIDC trusted-publishing setup — configured separately on npmjs.com
    # for the `postcss-helmlab` package (same repo + workflow values).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if postcss-helmlab version needs publishing
        id: version-check
        run: |
          OLD=$(npm view postcss-helmlab version 2>/dev/null || echo "0.0.0")
          NEW=$(python3 -c "import json; print(json.load(open('packages/postcss-helmlab/package.json'))['version'])")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version-check.outputs.changed == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        if: steps.version-check.outputs.changed == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Rewrite local helmlab dependency to published version
        if: steps.version-check.outputs.changed == 'true'
        run: |
          # Replace `"helmlab": "file:../helmlab-js"` with the just-published version
          # so the published postcss-helmlab tarball pulls helmlab from the registry.
          HL_VERSION=$(python3 -c "import json; print(json.load(open('packages/helmlab-js/package.json'))['version'])")
          python3 -c "
          import json
          p = 'packages/postcss-helmlab/package.json'
          d = json.load(open(p))
          d['dependencies']['helmlab'] = '^' + '$HL_VERSION'
          json.dump(d, open(p, 'w'), indent=2)
          "

      - name: Wait until the helmlab version is on the registry
        # publish-npm has finished before this job starts, but the registry can
        # take minutes to list a new version, and npm install fails until it does
        # (1.0.2 on 2026-11-12). Poll every 15 s for up to 20 minutes.
        if: steps.version-check.outputs.changed == 'true'
        run: |
          HL_VERSION=$(python3 -c "import json; print(json.load(open('packages/helmlab-js/package.json'))['version'])")
          for i in $(seq 1 80); do
            if npm view "helmlab@$HL_VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "helmlab $HL_VERSION is on the registry"
              exit 0
            fi
            echo "waiting for helmlab $HL_VERSION ($i/80)"
            sleep 15
          done
          echo "helmlab $HL_VERSION did not appear on the registry within 20 minutes"
          exit 1

      - name: Install build dependencies
        # prepublishOnly runs build.js (esbuild). The dependency rewrite above
        # replaced the file: link, so a plain install now resolves helmlab from
        # the registry and pulls esbuild from devDependencies.
        if: steps.version-check.outputs.changed == 'true'
        run: cd packages/postcss-helmlab && npm install --no-audit --no-fund --no-package-lock

      - name: Publish postcss-helmlab (OIDC, provenance)
        if: steps.version-check.outputs.changed == 'true'
        run: cd packages/postcss-helmlab && npm publish --access public

  # ─── 4. Publish PyPI (only when version changes) ───────
  publish-pypi:
    needs: [test-python, version-guard]
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC): no PYPI_TOKEN — pypa/gh-action-pypi-publish
    # exchanges the GitHub OIDC token for a short-lived PyPI credential.
    # Requires the trusted publisher to be configured on pypi.org for `helmlab`
    # (owner helmlab-space, repo helmlab, workflow deploy.yml, no environment).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Python version changed
        id: version-check
        run: |
          OLD=$(curl -s https://pypi.org/pypi/helmlab/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "0.0.0")
          NEW=$(python3 -c "
          for line in open('pyproject.toml'):
              if line.strip().startswith('version'):
                  print(line.split('\"')[1])
                  break
          ")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version-check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        if: steps.version-check.outputs.changed == 'true'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (OIDC)
        if: steps.version-check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

